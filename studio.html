<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Project Y — 3D Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#070910;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  width:100vw;
  height:100vh;
}

header{
  position:fixed;
  top:18px;
  left:20px;
  right:20px;
  z-index:10;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:15px 20px;

  background:rgba(10,12,20,.75);
  backdrop-filter:blur(15px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
}

.logo{
  font-weight:bold;
  font-size:20px;
}

.logo span{
  color:#7c9cff;
}

.back{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.panel{
  position:fixed;
  z-index:5;

  right:20px;
  top:90px;

  width:280px;
  padding:22px;

  border-radius:20px;

  background:rgba(15,18,29,.9);
  border:1px solid rgba(255,255,255,.12);

  backdrop-filter:blur(15px);
}

.panel h1{
  font-size:24px;
  margin-bottom:8px;
}

.panel p{
  color:#8f98aa;
  font-size:13px;
  line-height:1.5;
  margin-bottom:20px;
}

label{
  display:block;
  color:#ccc;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  margin-bottom:20px;
}

button{
  width:100%;
  padding:12px;
  margin-bottom:9px;

  border-radius:10px;
  border:1px solid rgba(255,255,255,.12);

  background:rgba(255,255,255,.06);
  color:white;

  cursor:pointer;
}

button:hover{
  background:#7c9cff;
  color:#05060a;
}

@media(max-width:700px){

  .panel{
    left:12px;
    right:12px;
    bottom:15px;
    top:auto;
    width:auto;
  }

}
</style>
</head>

<body>

<header>

<div class="logo">
PROJECT Y<span>.</span>
</div>

<a class="back" href="index.html">
← Back
</a>

</header>

<div id="app"></div>

<div class="panel">

<h1>3D Studio</h1>

<p>
Your first Project Y prototype.
</p>

<label>Shirt colour</label>

<input
id="color"
type="color"
value="#eeeeee"
>

<label>Design size</label>

<input
id="size"
type="range"
min="0.5"
max="2"
step="0.1"
value="1"
>

<button id="projectY">
PROJECT Y
</button>

<button id="future">
FUTURE
</button>

<button id="remove">
Remove Design
</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* SCENE */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x070910);


/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
100
);

camera.position.set(
0,
1,
6
);


/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

document
.getElementById("app")
.appendChild(renderer.domElement);


/* LIGHT */

const light =
new THREE.DirectionalLight(
0xffffff,
3
);

light.position.set(
3,
5,
5
);

scene.add(light);


const ambient =
new THREE.AmbientLight(
0xffffff,
1.5
);

scene.add(ambient);


/* SHIRT */

const shirt =
new THREE.Group();

scene.add(shirt);


const material =
new THREE.MeshStandardMaterial({
color:0xeeeeee,
roughness:.8
});


/* BODY */

const body =
new THREE.Mesh(
new THREE.BoxGeometry(
2.4,
2.8,
.7
),
material
);

body.position.y=1.2;

shirt.add(body);


/* SLEEVES */

const sleeveGeometry =
new THREE.BoxGeometry(
.9,
1.4,
.7
);


const left =
new THREE.Mesh(
sleeveGeometry,
material
);

left.position.set(
-1.55,
1.8,
0
);

left.rotation.z=-.35;

shirt.add(left);


const right =
new THREE.Mesh(
sleeveGeometry,
material
);

right.position.set(
1.55,
1.8,
0
);

right.rotation.z=.35;

shirt.add(right);


/* DESIGN */

let design=null;


function makeDesign(text){

if(design){

shirt.remove(design);

design.material.map.dispose();

design.material.dispose();

design.geometry.dispose();

}


const canvas=
document.createElement("canvas");

canvas.width=1000;
canvas.height=400;

const ctx=
canvas.getContext("2d");

ctx.clearRect(
0,0,1000,400
);

ctx.fillStyle="#111111";

ctx.font="bold 120px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(
text,
500,
200
);


const texture=
new THREE.CanvasTexture(canvas);


const designMaterial=
new THREE.MeshBasicMaterial({
map:texture,
transparent:true
});


design=
new THREE.Mesh(
new THREE.PlaneGeometry(
1.4,
.56
),
designMaterial
);

design.position.set(
0,
1.35,
.36
);

shirt.add(design);

}


/* COLOR */

document
.getElementById("color")
.oninput=function(){

material.color.set(
this.value
);

};


/* SIZE */

document
.getElementById("size")
.oninput=function(){

if(design){

const s=
Number(this.value);

design.scale.set(
s,s,s
);

}

};


/* BUTTONS */

document
.getElementById("projectY")
.onclick=function(){

makeDesign("PROJECT Y");

};


document
.getElementById("future")
.onclick=function(){

makeDesign("FUTURE");

};


document
.getElementById("remove")
.onclick=function(){

if(design){

shirt.remove(design);

design.material.map.dispose();

design.material.dispose();

design.geometry.dispose();

design=null;

}

};


/* ROTATION */

function animate(){

requestAnimationFrame(
animate
);

shirt.rotation.y+=0.006;

renderer.render(
scene,
camera
);

}

animate();


/* RESIZE */

window.onresize=function(){

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

};

</script>

</body>
</html>
