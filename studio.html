<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project Y — 3D Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #05060a;
      color: white;
      overflow: hidden;
    }

    #canvas {
      position: fixed;
      inset: 0;
    }

    header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(94%, 1100px);
      padding: 15px 20px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(5,6,10,.72);
      backdrop-filter: blur(18px);
      z-index: 20;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
    }

    .logo span {
      color: #7c9cff;
    }

    .back {
      color: #aeb6c8;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    .panel {
      position: fixed;
      z-index: 10;

      top: 95px;
      right: 22px;

      width: 290px;
      padding: 24px;

      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.12);

      background: rgba(12,15,24,.84);
      backdrop-filter: blur(20px);

      box-shadow: 0 20px 70px rgba(0,0,0,.3);
    }

    .panel h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .panel-description {
      color: #8f98aa;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .control {
      margin-bottom: 22px;
    }

    .control label {
      display: block;
      color: #cbd2df;
      font-size: 13px;
      margin-bottom: 9px;
    }

    input[type="color"] {
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: transparent;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #7c9cff;
      cursor: pointer;
    }

    .button {
      width: 100%;
      padding: 12px;

      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.12);

      background: rgba(255,255,255,.055);
      color: white;

      cursor: pointer;
      margin-bottom: 9px;

      transition: .25s;
    }

    .button:hover {
      background: rgba(124,156,255,.15);
      border-color: #7c9cff;
      transform: translateY(-2px);
    }

    .primary {
      background: white;
      color: #05060a;
      font-weight: bold;
    }

    .primary:hover {
      background: white;
    }

    .info {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);

      padding: 10px 17px;
      border-radius: 30px;

      background: rgba(10,12,18,.75);
      border: 1px solid rgba(255,255,255,.1);

      color: #8f98aa;
      font-size: 12px;

      z-index: 10;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 50;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #05060a;

      font-size: 18px;
    }

    @media (max-width: 700px) {

      .panel {
        left: 12px;
        right: 12px;
        bottom: 55px;
        top: auto;
        width: auto;
        padding: 18px;
      }

      .panel-description {
        margin-bottom: 12px;
      }

      .control {
        margin-bottom: 12px;
      }

      .info {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="loading" id="loading" style="display:none;">
  Loading Project Y...
</div>

  <header>

    <div class="logo">
      PROJECT Y<span>.</span>
    </div>

    <a class="back" href="index.html">
      ← Back to portfolio
    </a>

  </header>

  <div id="canvas"></div>

  <div class="panel">

    <h1>3D Studio</h1>

    <p class="panel-description">
      Design your virtual clothing piece and explore it from every angle.
    </p>

    <div class="control">

      <label>Garment Color</label>

      <input
        id="shirtColor"
        type="color"
        value="#f2f2f2"
      >

    </div>

    <div class="control">

      <label>Design Size</label>

      <input
        id="designSize"
        type="range"
        min="0.5"
        max="2"
        step="0.05"
        value="1"
      >

    </div>

    <div class="control">

      <label>Choose Design</label>

      <button class="button primary" id="designY">
        PROJECT Y
      </button>

      <button class="button" id="designFuture">
        FUTURE
      </button>

      <button class="button" id="removeDesign">
        Remove Design
      </button>

    </div>

    <button class="button" id="reset">
      Reset Studio
    </button>

  </div>

  <div class="info">
    Drag to rotate • Scroll to zoom
  </div>


  <!-- THREE.JS -->

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>


  <script>

    /* =========================
       BASIC THREE.JS SETUP
    ========================= */

    const scene = new THREE.Scene();

    scene.background =
      new THREE.Color(0x05060a);


    const camera =
      new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );

    camera.position.set(
      0,
      1.4,
      5
    );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    document
      .getElementById("canvas")
      .appendChild(renderer.domElement);


    /* =========================
       CAMERA CONTROLS
    ========================= */

    const controls =
      new THREE.OrbitControls(
        camera,
        renderer.domElement
      );

    controls.enableDamping = true;

    controls.dampingFactor = 0.07;

    controls.minDistance = 3;

    controls.maxDistance = 8;

    controls.target.set(
      0,
      1.2,
      0
    );


    /* =========================
       LIGHTING
    ========================= */

    const ambient =
      new THREE.AmbientLight(
        0xffffff,
        2
      );

    scene.add(ambient);


    const mainLight =
      new THREE.DirectionalLight(
        0xffffff,
        3
      );

    mainLight.position.set(
      3,
      5,
      4
    );

    mainLight.castShadow = true;

    scene.add(mainLight);


    const blueLight =
      new THREE.PointLight(
        0x7c9cff,
        18,
        10
      );

    blueLight.position.set(
      -3,
      2,
      3
    );

    scene.add(blueLight);


    /* =========================
       SHIRT GROUP
    ========================= */

    const shirt =
      new THREE.Group();

    scene.add(shirt);


    const shirtMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xf2f2f2,
        roughness: 0.78,
        metalness: 0
      });


    /* =========================
       SHIRT BODY
    ========================= */

    const bodyGeometry =
      new THREE.BoxGeometry(
        2.25,
        2.7,
        0.7,
        12,
        16,
        8
      );

    const body =
      new THREE.Mesh(
        bodyGeometry,
        shirtMaterial
      );

    body.position.y = 1.3;

    body.castShadow = true;

    body.receiveShadow = true;

    shirt.add(body);


    /* =========================
       LEFT SLEEVE
    ========================= */

    const sleeveGeometry =
      new THREE.BoxGeometry(
        0.8,
        1.35,
        0.7,
        10,
        10,
        8
      );


    const leftSleeve =
      new THREE.Mesh(
        sleeveGeometry,
        shirtMaterial
      );

    leftSleeve.position.set(
      -1.4,
      1.7,
      0
    );

    leftSleeve.rotation.z =
      -0.35;

    leftSleeve.castShadow = true;

    shirt.add(leftSleeve);


    /* =========================
       RIGHT SLEEVE
    ========================= */

    const rightSleeve =
      new THREE.Mesh(
        sleeveGeometry,
        shirtMaterial
      );

    rightSleeve.position.set(
      1.4,
      1.7,
      0
    );

    rightSleeve.rotation.z =
      0.35;

    rightSleeve.castShadow = true;

    shirt.add(rightSleeve);


    /* =========================
       NECK COLLAR
    ========================= */

    const collarGeometry =
      new THREE.TorusGeometry(
        0.4,
        0.075,
        16,
        40,
        Math.PI * 1.8
      );

    const collar =
      new THREE.Mesh(
        collarGeometry,
        shirtMaterial
      );

    collar.rotation.x =
      Math.PI / 2;

    collar.position.set(
      0,
      2.55,
      0.38
    );

    shirt.add(collar);


    /* =========================
       DESIGN SYSTEM
    ========================= */

    let design = null;


    function createDesign(text) {

      removeDesign();


      const canvas =
        document.createElement(
          "canvas"
        );

      canvas.width = 1024;

      canvas.height = 512;


      const ctx =
        canvas.getContext("2d");


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.font =
        "bold 120px Arial";

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";


      ctx.fillStyle =
        "#111827";


      ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
      );


      const texture =
        new THREE.CanvasTexture(
          canvas
        );

      texture.colorSpace =
        THREE.SRGBColorSpace;


      const material =
        new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true
        });


      const geometry =
        new THREE.PlaneGeometry(
          1.45,
          0.72
        );


      design =
        new THREE.Mesh(
          geometry,
          material
        );


      design.position.set(
        0,
        1.45,
        0.365
      );


      shirt.add(design);

    }


    function removeDesign() {

      if (!design) {
        return;
      }


      shirt.remove(design);


      design.geometry.dispose();

      design.material.map.dispose();

      design.material.dispose();


      design = null;

    }


    /* =========================
       COLOR CONTROL
    ========================= */

    document
      .getElementById("shirtColor")
      .addEventListener(
        "input",
        function() {

          shirtMaterial.color.set(
            this.value
          );

        }
      );


    /* =========================
       DESIGN SIZE
    ========================= */

    document
      .getElementById("designSize")
      .addEventListener(
        "input",
        function() {

          if (!design) {
            return;
          }


          const size =
            Number(this.value);


          design.scale.set(
            size,
            size,
            size
          );

        }
      );


    /* =========================
       DESIGN BUTTONS
    ========================= */

    document
      .getElementById("designY")
      .addEventListener(
        "click",
        function() {

          createDesign(
            "PROJECT Y"
          );

        }
      );


    document
      .getElementById("designFuture")
      .addEventListener(
        "click",
        function() {

          createDesign(
            "FUTURE"
          );

        }
      );


    document
      .getElementById("removeDesign")
      .addEventListener(
        "click",
        function() {

          removeDesign();

        }
      );


    /* =========================
       RESET
    ========================= */

    document
      .getElementById("reset")
      .addEventListener(
        "click",
        function() {

          shirtMaterial.color.set(
            0xf2f2f2
          );


          document
            .getElementById("shirtColor")
            .value = "#f2f2f2";


          document
            .getElementById("designSize")
            .value = 1;


          removeDesign();


          camera.position.set(
            0,
            1.4,
            5
          );


          controls.target.set(
            0,
            1.2,
            0
          );

          controls.update();

        }
      );


    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(
      "resize",
      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    /* =========================
       ANIMATION
    ========================= */

    function animate() {

      requestAnimationFrame(
        animate
      );


      controls.update();


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =========================
       REMOVE LOADING SCREEN
    ========================= */

    document
      .getElementById("loading")
      .style.display = "none";

  </script>

</body>
  </html>
