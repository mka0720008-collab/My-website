<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project Y | 3D Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070910;
      color: white;
      overflow: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(7,9,16,.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .logo span {
      color: #7c9cff;
    }

    .back {
      color: #bbb;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    #studio {
      width: 100vw;
      height: 100vh;
    }

    .panel {
      position: fixed;
      right: 20px;
      top: 90px;
      width: 280px;
      padding: 22px;
      border-radius: 20px;
      background: rgba(15,18,29,.88);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.12);
      z-index: 5;
    }

    .panel h2 {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .panel p {
      color: #929bad;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .control {
      margin-bottom: 20px;
    }

    .control label {
      display: block;
      font-size: 13px;
      color: #cbd1df;
      margin-bottom: 8px;
    }

    input[type="color"] {
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    .design-button {
      width: 100%;
      padding: 11px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .design-button:hover {
      background: rgba(255,255,255,.12);
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      padding: 10px 15px;
      border-radius: 30px;
      background: rgba(10,12,20,.75);
      color: #9da6ba;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,.1);
      z-index: 5;
    }

    @media (max-width: 700px) {
      .panel {
        right: 10px;
        left: 10px;
        top: auto;
        bottom: 60px;
        width: auto;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">PROJECT Y<span>.</span></div>

  <a class="back" href="index.html">
    ← Back to portfolio
  </a>
</header>

<div id="studio"></div>

<div class="panel">

  <h2>3D Studio</h2>

  <p>
    Experiment with your virtual garment.
  </p>

  <div class="control">

    <label>Shirt Color</label>

    <input
      id="shirtColor"
      type="color"
      value="#ffffff"
    >

  </div>

  <div class="control">

    <label>Design Size</label>

    <input
      id="designSize"
      type="range"
      min="0.4"
      max="2"
      step="0.05"
      value="1"
    >

  </div>

  <div class="control">

    <label>Design</label>

    <button class="design-button" id="design1">
      ✦ PROJECT Y
    </button>

    <button class="design-button" id="design2">
      ◆ FUTURE
    </button>

    <button class="design-button" id="removeDesign">
      Remove Design
    </button>

  </div>

</div>

<div class="hint">
  Drag to rotate • Scroll to zoom
</div>

<script type="module">

  import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

  import { OrbitControls } from
  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


  /* SCENE */

  const scene = new THREE.Scene();

  scene.background = new THREE.Color(0x070910);


  /* CAMERA */

  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );

  camera.position.set(0, 1.2, 5);


  /* RENDERER */

  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  document
    .getElementById("studio")
    .appendChild(renderer.domElement);


  /* CONTROLS */

  const controls = new OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping = true;

  controls.minDistance = 3;
  controls.maxDistance = 8;

  controls.target.set(0, 1, 0);


  /* LIGHTING */

  const ambientLight =
    new THREE.AmbientLight(
      0xffffff,
      2
    );

  scene.add(ambientLight);


  const keyLight =
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  keyLight.position.set(
    3,
    5,
    4
  );

  scene.add(keyLight);


  const fillLight =
    new THREE.DirectionalLight(
      0x7c9cff,
      2
    );

  fillLight.position.set(
    -4,
    2,
    2
  );

  scene.add(fillLight);


  /* SHIRT */

  const shirtGroup =
    new THREE.Group();

  scene.add(shirtGroup);


  const shirtMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.75,
      metalness: 0
    });


  /* BODY */

  const bodyGeometry =
    new THREE.BoxGeometry(
      2.2,
      2.6,
      0.65,
      32,
      32,
      16
    );

  const body =
    new THREE.Mesh(
      bodyGeometry,
      shirtMaterial
    );

  body.position.y = 1.2;

  shirtGroup.add(body);


  /* LEFT SLEEVE */

  const sleeveGeometry =
    new THREE.BoxGeometry(
      0.75,
      1.35,
      0.65,
      16,
      16,
      12
    );

  const leftSleeve =
    new THREE.Mesh(
      sleeveGeometry,
      shirtMaterial
    );

  leftSleeve.position.set(
    -1.35,
    1.65,
    0
  );

  leftSleeve.rotation.z =
    -0.35;

  shirtGroup.add(leftSleeve);


  /* RIGHT SLEEVE */

  const rightSleeve =
    new THREE.Mesh(
      sleeveGeometry,
      shirtMaterial
    );

  rightSleeve.position.set(
    1.35,
    1.65,
    0
  );

  rightSleeve.rotation.z =
    0.35;

  shirtGroup.add(rightSleeve);


  /* NECK */

  const neckGeometry =
    new THREE.TorusGeometry(
      0.38,
      0.07,
      16,
      48,
      Math.PI * 1.8
    );

  const neck =
    new THREE.Mesh(
      neckGeometry,
      shirtMaterial
    );

  neck.rotation.x =
    Math.PI / 2;

  neck.position.set(
    0,
    2.43,
    0.34
  );

  shirtGroup.add(neck);


  /* DESIGN */

  let design = null;


  function createDesign(text) {

    if (design) {

      shirtGroup.remove(design);

      design.material.dispose();
      design.geometry.dispose();

    }


    const canvas =
      document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 512;

    const ctx =
      canvas.getContext("2d");


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.font =
      "bold 130px Arial";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillStyle =
      "#111827";

    ctx.fillText(
      text,
      canvas.width / 2,
      canvas.height / 2
    );


    const texture =
      new THREE.CanvasTexture(canvas);

    texture.colorSpace =
      THREE.SRGBColorSpace;


    const material =
      new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true
      });


    const geometry =
      new THREE.PlaneGeometry(
        1.35,
        0.68
      );


    design =
      new THREE.Mesh(
        geometry,
        material
      );


    design.position.set(
      0,
      1.35,
      0.34
    );


    shirtGroup.add(design);

  }


  /* COLOR */

  document
    .getElementById("shirtColor")
    .addEventListener(
      "input",
      function () {

        shirtMaterial.color.set(
          this.value
        );

      }
    );


  /* DESIGN SIZE */

  document
    .getElementById("designSize")
    .addEventListener(
      "input",
      function () {

        if (!design) return;

        const scale =
          Number(this.value);

        design.scale.set(
          scale,
          scale,
          scale
        );

      }
    );


  /* BUTTONS */

  document
    .getElementById("design1")
    .addEventListener(
      "click",
      function () {

        createDesign(
          "PROJECT Y"
        );

      }
    );


  document
    .getElementById("design2")
    .addEventListener(
      "click",
      function () {

        createDesign(
          "FUTURE"
        );

      }
    );


  document
    .getElementById("removeDesign")
    .addEventListener(
      "click",
      function () {

        if (!design) return;

        shirtGroup.remove(
          design
        );

        design.material.dispose();
        design.geometry.dispose();

        design = null;

      }
    );


  /* RESIZE */

  window.addEventListener(
    "resize",
    function () {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }
  );


  /* ANIMATION */

  function animate() {

    requestAnimationFrame(
      animate
    );

    controls.update();

    renderer.render(
      scene,
      camera
    );

  }

  animate();

</script>

</body>
</html>
