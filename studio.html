<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Y — 3D Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070910;
  color:white;
  overflow:hidden;
}

#app{
  position:fixed;
  inset:0;
}

header{
  position:fixed;
  top:16px;
  left:16px;
  right:16px;
  z-index:20;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:14px 18px;

  background:rgba(8,10,17,.72);
  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo span{
  color:#7c9cff;
}

.back{
  color:#aeb5c5;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:white;
}


/* STUDIO PANEL */

.panel{
  position:fixed;
  right:20px;
  top:90px;
  z-index:10;

  width:300px;
  padding:22px;

  background:rgba(13,16,26,.88);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;

  box-shadow:0 20px 70px rgba(0,0,0,.35);
}

.panel h1{
  font-size:24px;
  margin-bottom:7px;
}

.subtitle{
  color:#8e97a9;
  font-size:13px;
  line-height:1.5;
  margin-bottom:22px;
}

.control{
  margin-bottom:19px;
}

.control label{
  display:block;
  font-size:13px;
  color:#cbd2df;
  margin-bottom:8px;
}

input[type=color]{
  width:100%;
  height:40px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

input[type=range]{
  width:100%;
  accent-color:#7c9cff;
  cursor:pointer;
}

.value{
  float:right;
  color:#7c9cff;
}

.button{
  width:100%;
  padding:11px;

  margin-bottom:8px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:11px;

  background:rgba(255,255,255,.05);
  color:white;

  cursor:pointer;
  transition:.2s;
}

.button:hover{
  background:rgba(124,156,255,.18);
  border-color:#7c9cff;
}

.button.active{
  background:#7c9cff;
  color:#05060a;
  border-color:#7c9cff;
  font-weight:bold;
}


/* INSTRUCTIONS */

.hint{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);

  z-index:10;

  padding:10px 17px;

  border-radius:30px;

  background:rgba(8,10,17,.75);
  border:1px solid rgba(255,255,255,.1);

  color:#929bad;
  font-size:12px;
  white-space:nowrap;
}


/* MOBILE */

@media(max-width:700px){

  header{
    top:10px;
    left:10px;
    right:10px;
  }

  .panel{
    left:10px;
    right:10px;
    bottom:10px;
    top:auto;
    width:auto;

    padding:15px;

    border-radius:18px;
  }

  .panel h1{
    font-size:20px;
  }

  .subtitle{
    display:none;
  }

  .control{
    margin-bottom:11px;
  }

  .button{
    padding:9px;
    margin-bottom:6px;
  }

  .hint{
    display:none;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    PROJECT Y<span>.</span>
  </div>

  <a class="back" href="index.html">
    ← Back
  </a>

</header>

<div id="app"></div>


<div class="panel">

  <h1>3D Studio</h1>

  <p class="subtitle">
    Create and explore your clothing concept in 3D.
  </p>


  <div class="control">

    <label>
      Garment Color
    </label>

    <input
      id="color"
      type="color"
      value="#eeeeee"
    >

  </div>


  <div class="control">

    <label>
      Design Size

      <span
        class="value"
        id="sizeValue"
      >
        100%
      </span>

    </label>

    <input
      id="size"
      type="range"
      min="50"
      max="180"
      value="100"
    >

  </div>


  <div class="control">

    <label>
      Design
    </label>

    <button
      class="button active"
      id="projectY"
    >
      ✦ PROJECT Y
    </button>

    <button
      class="button"
      id="future"
    >
      ◆ FUTURE
    </button>

    <button
      class="button"
      id="remove"
    >
      Remove Design
    </button>

  </div>


  <button
    class="button"
    id="reset"
  >
    Reset
  </button>

</div>


<div class="hint">
  👆 Drag to rotate &nbsp; • &nbsp; Pinch / scroll to zoom
</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =================================
   SCENE
================================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x070910);


/* =================================
   CAMERA
================================= */

const camera =
new THREE.PerspectiveCamera(
  42,
  window.innerWidth /
  window.innerHeight,
  0.1,
  100
);

camera.position.set(
  0,
  1.2,
  6
);


/* =================================
   RENDERER
================================= */

const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

document
  .getElementById("app")
  .appendChild(
    renderer.domElement
  );


/* =================================
   LIGHTING
================================= */

const ambient =
new THREE.AmbientLight(
  0xffffff,
  1.8
);

scene.add(ambient);


const keyLight =
new THREE.DirectionalLight(
  0xffffff,
  3
);

keyLight.position.set(
  3,
  5,
  5
);

keyLight.castShadow = true;

scene.add(keyLight);


const fillLight =
new THREE.DirectionalLight(
  0x7c9cff,
  1.5
);

fillLight.position.set(
  -4,
  2,
  3
);

scene.add(fillLight);


/* =================================
   SHIRT
================================= */

const shirt =
new THREE.Group();

scene.add(shirt);


/* MATERIAL */

const material =
new THREE.MeshStandardMaterial({
  color:0xeeeeee,
  roughness:.78,
  metalness:0
});


/* BODY */

const body =
new THREE.Mesh(
  new THREE.BoxGeometry(
    2.3,
    2.8,
    .72,
    8,
    12,
    6
  ),
  material
);

body.position.y=1.25;

body.castShadow=true;

body.receiveShadow=true;

shirt.add(body);


/* LEFT SLEEVE */

const sleeveGeometry =
new THREE.BoxGeometry(
  .85,
  1.45,
  .72,
  6,
  8,
  5
);


const leftSleeve =
new THREE.Mesh(
  sleeveGeometry,
  material
);

leftSleeve.position.set(
  -1.5,
  1.75,
  0
);

leftSleeve.rotation.z=-.38;

leftSleeve.castShadow=true;

shirt.add(leftSleeve);


/* RIGHT SLEEVE */

const rightSleeve =
new THREE.Mesh(
  sleeveGeometry,
  material
);

rightSleeve.position.set(
  1.5,
  1.75,
  0
);

rightSleeve.rotation.z=.38;

rightSleeve.castShadow=true;

shirt.add(rightSleeve);


/* COLLAR */

const collar =
new THREE.Mesh(
  new THREE.TorusGeometry(
    .38,
    .07,
    16,
    40,
    Math.PI*1.8
  ),
  material
);

collar.rotation.x=
Math.PI/2;

collar.position.set(
  0,
  2.52,
  .38
);

shirt.add(collar);


/* =================================
   DESIGN
================================= */

let design=null;


function createDesign(text){

  removeDesign();


  const canvas =
  document.createElement(
    "canvas"
  );

  canvas.width=1200;
  canvas.height=600;


  const ctx =
  canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    1200,
    600
  );


  ctx.font=
  "bold 150px Arial";

  ctx.textAlign=
  "center";

  ctx.textBaseline=
  "middle";

  ctx.fillStyle=
  "#111827";


  ctx.fillText(
    text,
    600,
    300
  );


  const texture =
  new THREE.CanvasTexture(
    canvas
  );


  const designMaterial =
  new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true
  });


  design =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      1.45,
      .72
    ),
    designMaterial
  );


  design.position.set(
    0,
    1.4,
    .37
  );


  shirt.add(design);

}


/* =================================
   REMOVE DESIGN
================================= */

function removeDesign(){

  if(!design){
    return;
  }


  shirt.remove(
    design
  );


  if(design.material.map){
    design.material.map.dispose();
  }

  design.material.dispose();

  design.geometry.dispose();

  design=null;

}


/* =================================
   COLOR
================================= */

document
.getElementById("color")
.addEventListener(
  "input",
  function(){

    material.color.set(
      this.value
    );

  }
);


/* =================================
   DESIGN SIZE
================================= */

document
.getElementById("size")
.addEventListener(
  "input",
  function(){

    const value =
    Number(this.value);

    document
      .getElementById(
        "sizeValue"
      )
      .textContent =
      value+"%";


    if(design){

      const scale =
      value/100;

      design.scale.set(
        scale,
        scale,
        scale
      );

    }

  }
);


/* =================================
   BUTTONS
================================= */

document
.getElementById("projectY")
.addEventListener(
  "click",
  function(){

    createDesign(
      "PROJECT Y"
    );

    activate(
      this
    );

  }
);


document
.getElementById("future")
.addEventListener(
  "click",
  function(){

    createDesign(
      "FUTURE"
    );

    activate(
      this
    );

  }
);


document
.getElementById("remove")
.addEventListener(
  "click",
  function(){

    removeDesign();

    document
      .querySelectorAll(
        ".button"
      )
      .forEach(
        b =>
        b.classList.remove(
          "active"
        )
      );

  }
);


function activate(button){

  document
    .querySelectorAll(
      ".button"
    )
    .forEach(
      b =>
      b.classList.remove(
        "active"
      )
    );

  button.classList.add(
    "active"
  );

}


/* =================================
   RESET
================================= */

document
.getElementById("reset")
.addEventListener(
  "click",
  function(){

    material.color.set(
      0xeeeeee
    );

    document
      .getElementById(
        "color"
      )
      .value="#eeeeee";


    document
      .getElementById(
        "size"
      )
      .value=100;


    document
      .getElementById(
        "sizeValue"
      )
      .textContent="100%";


    removeDesign();


    shirt.rotation.y=0;

    camera.position.set(
      0,
      1.2,
      6
    );

  }
);


/* =================================
   DRAG ROTATION
================================= */

let dragging=false;

let lastX=0;


renderer.domElement
.addEventListener(
  "pointerdown",
  function(event){

    dragging=true;

    lastX=
    event.clientX;

  }
);


renderer.domElement
.addEventListener(
  "pointerup",
  function(){

    dragging=false;

  }
);


renderer.domElement
.addEventListener(
  "pointerleave",
  function(){

    dragging=false;

  }
);


renderer.domElement
.addEventListener(
  "pointermove",
  function(event){

    if(!dragging){
      return;
    }


    const difference =
    event.clientX-lastX;


    shirt.rotation.y +=
    difference*.01;


    lastX=
    event.clientX;

  }
);


/* =================================
   ZOOM
================================= */

renderer.domElement
.addEventListener(
  "wheel",
  function(event){

    event.preventDefault();


    camera.position.z +=
    event.deltaY*.005;


    camera.position.z =
    Math.max(
      3.2,
      Math.min(
        9,
        camera.position.z
      )
    );

  },
  {passive:false}
);


/* =================================
   TOUCH PINCH ZOOM
================================= */

let startDistance=null;


renderer.domElement
.addEventListener(
  "touchmove",
  function(event){

    if(
      event.touches.length!==2
    ){
      return;
    }


    event.preventDefault();


    const a =
    event.touches[0];

    const b =
    event.touches[1];


    const dx =
    a.clientX-b.clientX;

    const dy =
    a.clientY-b.clientY;


    const distance =
    Math.sqrt(
      dx*dx+dy*dy
    );


    if(startDistance!==null){

      const difference =
      startDistance-distance;


      camera.position.z +=
      difference*.01;


      camera.position.z =
      Math.max(
        3.2,
        Math.min(
          9,
          camera.position.z
        )
      );

    }


    startDistance=
    distance;

  },
  {passive:false}
);


renderer.domElement
.addEventListener(
  "touchend",
  function(){

    startDistance=null;

  }
);


/* =================================
   RESIZE
================================= */

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
    window.innerWidth/
    window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =================================
   START
================================= */

createDesign(
  "PROJECT Y"
);


function animate(){

  requestAnimationFrame(
    animate
  );

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
