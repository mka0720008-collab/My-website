<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Y — 3D Studio</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070910;
  color:white;
  overflow:hidden;
}

#app{
  position:fixed;
  inset:0;
}

header{
  position:fixed;
  z-index:20;
  top:15px;
  left:15px;
  right:15px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:15px 18px;

  background:rgba(8,10,17,.75);
  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#7c9cff;
}

.back{
  color:#aab1c0;
  text-decoration:none;
  font-size:14px;
}

.panel{
  position:fixed;
  z-index:10;

  right:20px;
  top:90px;

  width:300px;
  max-height:calc(100vh - 110px);

  overflow-y:auto;

  padding:22px;

  background:rgba(13,16,26,.9);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
}

.panel h1{
  font-size:25px;
  margin-bottom:7px;
}

.description{
  color:#929bad;
  font-size:13px;
  line-height:1.5;
  margin-bottom:22px;
}

.control{
  margin-bottom:18px;
}

label{
  display:block;
  color:#cbd2df;
  font-size:13px;
  margin-bottom:8px;
}

.value{
  float:right;
  color:#7c9cff;
}

input[type="color"]{
  width:100%;
  height:40px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

input[type="range"]{
  width:100%;
  accent-color:#7c9cff;
  cursor:pointer;
}

input[type="file"]{
  width:100%;
  color:#aeb6c5;
  font-size:12px;
}

.button{
  width:100%;
  padding:11px;
  margin-bottom:8px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:11px;

  background:rgba(255,255,255,.05);
  color:white;

  cursor:pointer;
}

.button:hover{
  background:rgba(124,156,255,.2);
  border-color:#7c9cff;
}

.hint{
  position:fixed;
  z-index:5;

  bottom:20px;
  left:50%;
  transform:translateX(-50%);

  padding:10px 17px;

  border-radius:30px;

  background:rgba(8,10,17,.8);
  border:1px solid rgba(255,255,255,.1);

  color:#929bad;
  font-size:12px;
  white-space:nowrap;
}

@media(max-width:700px){

  .panel{
    left:10px;
    right:10px;
    bottom:10px;
    top:auto;

    width:auto;
    max-height:42vh;

    padding:16px;
    border-radius:18px;
  }

  .panel h1{
    font-size:20px;
  }

  .description{
    display:none;
  }

  .control{
    margin-bottom:12px;
  }

  .hint{
    display:none;
  }

}

</style>
</head>


<body>


<header>

  <div class="logo">
    PROJECT Y<span>.</span>
  </div>

  <a href="index.html" class="back">
    ← Back
  </a>

</header>


<div id="app"></div>


<div class="panel">

  <h1>3D Studio</h1>

  <p class="description">
    Turn an idea into a virtual clothing design.
  </p>


  <!-- SHIRT COLOR -->

  <div class="control">

    <label>
      Garment Color
    </label>

    <input
      id="shirtColor"
      type="color"
      value="#eeeeee"
    >

  </div>


  <!-- UPLOAD DESIGN -->

  <div class="control">

    <label>
      Upload Your Design
    </label>

    <input
      id="imageUpload"
      type="file"
      accept="image/*"
    >

  </div>


  <!-- DESIGN SIZE -->

  <div class="control">

    <label>

      Design Size

      <span
        class="value"
        id="sizeValue"
      >
        100%
      </span>

    </label>

    <input
      id="designSize"
      type="range"
      min="30"
      max="220"
      value="100"
    >

  </div>


  <!-- DESIGN VERTICAL POSITION -->

  <div class="control">

    <label>

      Design Position

      <span
        class="value"
        id="positionValue"
      >
        0
      </span>

    </label>

    <input
      id="designPosition"
      type="range"
      min="-70"
      max="70"
      value="0"
    >

  </div>


  <button
    class="button"
    id="projectButton"
  >
    ✦ PROJECT Y Design
  </button>


  <button
    class="button"
    id="futureButton"
  >
    ◆ FUTURE Design
  </button>


  <button
    class="button"
    id="removeButton"
  >
    Remove Design
  </button>


  <button
    class="button"
    id="resetButton"
  >
    Reset Studio
  </button>

</div>


<div class="hint">
  Drag to rotate • Pinch or scroll to zoom
</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>


/* ==========================================
   SCENE
========================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x070910);


/* ==========================================
   CAMERA
========================================== */

const camera =
new THREE.PerspectiveCamera(
  40,
  window.innerWidth /
  window.innerHeight,
  0.1,
  100
);

camera.position.set(
  0,
  1.4,
  6
);


/* ==========================================
   RENDERER
========================================== */

const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled=true;

document
  .getElementById("app")
  .appendChild(
    renderer.domElement
  );


/* ==========================================
   ORBIT CONTROLS

   Drag = rotate
   Pinch = zoom
   Scroll = zoom
========================================== */

const controls =
new THREE.OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping=true;

controls.dampingFactor=.08;

controls.enablePan=false;

controls.minDistance=3;

controls.maxDistance=9;

controls.target.set(
  0,
  1.3,
  0
);


/* ==========================================
   LIGHTS
========================================== */

const ambient =
new THREE.AmbientLight(
  0xffffff,
  1.8
);

scene.add(ambient);


const mainLight =
new THREE.DirectionalLight(
  0xffffff,
  3
);

mainLight.position.set(
  3,
  5,
  5
);

mainLight.castShadow=true;

scene.add(mainLight);


const sideLight =
new THREE.DirectionalLight(
  0x7c9cff,
  2
);

sideLight.position.set(
  -4,
  3,
  4
);

scene.add(sideLight);


/* ==========================================
   SHIRT GROUP
========================================== */

const shirt =
new THREE.Group();

scene.add(shirt);
  const loader = new THREE.GLTFLoader();
loader.load(
  "t-shirt.glb",

  function(gltf){

    const realShirt = gltf.scene;

    realShirt.scale.set(
      2,
      2,
      2
    );

    realShirt.position.set(
      0,
      -1,
      0
    );

    shirt.add(realShirt);

    console.log("REAL SHIRT LOADED");

  },

  undefined,

  function(error){

    console.error(
      "SHIRT ERROR:",
      error
    );

  }
);


/* ==========================================
   SHIRT MATERIAL
========================================== */

const shirtMaterial =
new THREE.MeshStandardMaterial({
  color:0xeeeeee,
  roughness:.8,
  metalness:0
});


/* ==========================================
   SHIRT BODY

   Rounded box gives the body
   a softer clothing-like appearance.
========================================== */

const bodyGeometry =
new THREE.BoxGeometry(
  2.3,
  2.7,
  .65,
  12,
  16,
  8
);

const body =
new THREE.Mesh(
  bodyGeometry,
  shirtMaterial
);

body.position.y=1.25;

body.castShadow=true;

shirt.add(body);


/* ==========================================
   LEFT SLEEVE
========================================== */

const sleeveGeometry =
new THREE.BoxGeometry(
  .85,
  1.45,
  .65,
  8,
  10,
  6
);

const leftSleeve =
new THREE.Mesh(
  sleeveGeometry,
  shirtMaterial
);

leftSleeve.position.set(
  -1.5,
  1.75,
  0
);

leftSleeve.rotation.z=-.38;

leftSleeve.castShadow=true;

shirt.add(leftSleeve);


/* ==========================================
   RIGHT SLEEVE
========================================== */

const rightSleeve =
new THREE.Mesh(
  sleeveGeometry,
  shirtMaterial
);

rightSleeve.position.set(
  1.5,
  1.75,
  0
);

rightSleeve.rotation.z=.38;

rightSleeve.castShadow=true;

shirt.add(rightSleeve);


/* ==========================================
   COLLAR
========================================== */

const collarGeometry =
new THREE.TorusGeometry(
  .38,
  .065,
  16,
  40,
  Math.PI*1.8
);

const collar =
new THREE.Mesh(
  collarGeometry,
  shirtMaterial
);

collar.rotation.x=
Math.PI/2;

collar.position.set(
  0,
  2.48,
  .34
);

shirt.add(collar);


/* ==========================================
   DESIGN
========================================== */

let design=null;


function createTextDesign(text){

  removeDesign();


  const canvas =
  document.createElement(
    "canvas"
  );

  canvas.width=1200;
  canvas.height=600;


  const ctx =
  canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    1200,
    600
  );


  ctx.font=
  "bold 145px Arial";

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.fillStyle="#111827";


  ctx.fillText(
    text,
    600,
    300
  );


  const texture =
  new THREE.CanvasTexture(
    canvas
  );


  const material =
  new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true
  });


  design =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      1.5,
      .75
    ),
    material
  );


  design.position.set(
    0,
    1.4,
    .34
  );


  shirt.add(design);

}


/* ==========================================
   UPLOAD IMAGE
========================================== */

document
  .getElementById("imageUpload")
  .addEventListener(
    "change",
    function(event){

      const file =
      event.target.files[0];

      if(!file){
        return;
      }


      const reader =
      new FileReader();


      reader.onload=function(e){

        removeDesign();


        const texture =
        new THREE.TextureLoader()
        .load(
          e.target.result
        );


        const material =
        new THREE.MeshBasicMaterial({
          map:texture,
          transparent:true
        });


        design =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            1.5,
            1.0
          ),
          material
        );


        design.position.set(
          0,
          1.4,
          .35
        );


        shirt.add(design);

      };


      reader.readAsDataURL(
        file
      );

    }
  );


/* ==========================================
   REMOVE DESIGN
========================================== */

function removeDesign(){

  if(!design){
    return;
  }


  shirt.remove(
    design
  );


  if(design.material.map){
    design.material.map.dispose();
  }

  design.material.dispose();

  design.geometry.dispose();

  design=null;

}


/* ==========================================
   COLOR
========================================== */

document
  .getElementById("shirtColor")
  .addEventListener(
    "input",
    function(){

      shirtMaterial.color.set(
        this.value
      );

    }
  );


/* ==========================================
   DESIGN SIZE
========================================== */

document
  .getElementById("designSize")
  .addEventListener(
    "input",
    function(){

      const value =
      Number(this.value);


      document
        .getElementById(
          "sizeValue"
        )
        .textContent =
        value+"%";


      if(!design){
        return;
      }


      const scale =
      value/100;


      design.scale.set(
        scale,
        scale,
        scale
      );

    }
  );


/* ==========================================
   DESIGN POSITION
========================================== */

document
  .getElementById("designPosition")
  .addEventListener(
    "input",
    function(){

      const value =
      Number(this.value);


      document
        .getElementById(
          "positionValue"
        )
        .textContent =
        value;


      if(!design){
        return;
      }


      design.position.y =
      1.4 +
      value/100;

    }
  );


/* ==========================================
   BUTTONS
========================================== */

document
  .getElementById("projectButton")
  .addEventListener(
    "click",
    function(){

      createTextDesign(
        "PROJECT Y"
      );

    }
  );


document
  .getElementById("futureButton")
  .addEventListener(
    "click",
    function(){

      createTextDesign(
        "FUTURE"
      );

    }
  );


document
  .getElementById("removeButton")
  .addEventListener(
    "click",
    function(){

      removeDesign();

    }
  );


/* ==========================================
   RESET
========================================== */

document
  .getElementById("resetButton")
  .addEventListener(
    "click",
    function(){

      shirtMaterial.color.set(
        0xeeeeee
      );


      document
        .getElementById(
          "shirtColor"
        )
        .value="#eeeeee";


      document
        .getElementById(
          "designSize"
        )
        .value=100;


      document
        .getElementById(
          "sizeValue"
        )
        .textContent="100%";


      document
        .getElementById(
          "designPosition"
        )
        .value=0;


      document
        .getElementById(
          "positionValue"
        )
        .textContent="0";


      removeDesign();


      controls.reset();

    }
  );


/* ==========================================
   START WITH PROJECT Y
========================================== */

createTextDesign(
  "PROJECT Y"
);


/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* ==========================================
   ANIMATION
========================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
