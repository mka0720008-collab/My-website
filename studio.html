<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Project Y — 3D Studio</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#070910;
  color:white;
  overflow:hidden;
}

#app{
  position:fixed;
  inset:0;
}

header{
  position:fixed;
  z-index:20;
  top:15px;
  left:15px;
  right:15px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:15px 18px;

  background:rgba(8,10,17,.75);
  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#7c9cff;
}

.back{
  color:#aab1c0;
  text-decoration:none;
  font-size:15px;
}

.panel{
  position:fixed;
  z-index:10;

  right:20px;
  top:90px;

  width:310px;
  max-height:calc(100vh - 110px);

  overflow-y:auto;

  padding:22px;

  background:rgba(13,16,26,.92);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
}

.panel h1{
  font-size:26px;
  margin-bottom:7px;
}

.description{
  color:#929bad;
  font-size:13px;
  line-height:1.5;
  margin-bottom:22px;
}

.control{
  margin-bottom:18px;
}

label{
  display:block;
  color:#cbd2df;
  font-size:13px;
  margin-bottom:8px;
}

.value{
  float:right;
  color:#7c9cff;
}

input[type="color"]{
  width:100%;
  height:42px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

input[type="range"]{
  width:100%;
  accent-color:#7c9cff;
  cursor:pointer;
}

input[type="file"]{
  width:100%;
  color:#aeb6c5;
  font-size:12px;
}

.button{
  width:100%;
  padding:12px;
  margin-bottom:8px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:11px;

  background:rgba(255,255,255,.05);
  color:white;

  cursor:pointer;
  font-size:14px;
}

.button:hover{
  background:rgba(124,156,255,.2);
  border-color:#7c9cff;
}

.status{
  margin-top:12px;
  padding:10px;

  border-radius:10px;

  background:rgba(255,255,255,.04);

  color:#929bad;
  font-size:12px;
  line-height:1.4;
}

.hint{
  position:fixed;
  z-index:5;

  bottom:20px;
  left:50%;

  transform:translateX(-50%);

  padding:10px 17px;

  border-radius:30px;

  background:rgba(8,10,17,.8);
  border:1px solid rgba(255,255,255,.1);

  color:#929bad;
  font-size:12px;

  white-space:nowrap;
}

.loading{
  position:fixed;
  z-index:30;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#070910;

  font-size:18px;
}

.hidden{
  display:none;
}

@media(max-width:700px){

  .panel{
    left:10px;
    right:10px;
    bottom:10px;
    top:auto;

    width:auto;

    max-height:43vh;

    padding:16px;

    border-radius:18px;
  }

  .panel h1{
    font-size:20px;
  }

  .description{
    display:none;
  }

  .control{
    margin-bottom:12px;
  }

  .hint{
    display:none;
  }

}

</style>

</head>


<body>


<div id="loading" class="loading">
  Loading Project Y 3D Studio...
</div>


<header>

  <div class="logo">
    PROJECT Y<span>.</span>
  </div>

  <a href="index.html" class="back">
    ← Back
  </a>

</header>


<div id="app"></div>


<div class="panel">

  <h1>3D Studio</h1>

  <p class="description">
    Design, customize and visualize your clothing idea
    in an interactive 3D environment.
  </p>


  <!-- GARMENT COLOR -->

  <div class="control">

    <label>
      Garment Color
    </label>

    <input
      id="shirtColor"
      type="color"
      value="#eeeeee"
    >

  </div>


  <!-- IMAGE -->

  <div class="control">

    <label>
      Upload Your Design
    </label>

    <input
      id="imageUpload"
      type="file"
      accept="image/*"
    >

  </div>


  <!-- DESIGN SIZE -->

  <div class="control">

    <label>

      Design Size

      <span
        class="value"
        id="sizeValue"
      >
        100%
      </span>

    </label>

    <input
      id="designSize"
      type="range"
      min="30"
      max="220"
      value="100"
    >

  </div>


  <!-- DESIGN HEIGHT -->

  <div class="control">

    <label>

      Design Position

      <span
        class="value"
        id="positionValue"
      >
        0
      </span>

    </label>

    <input
      id="designPosition"
      type="range"
      min="-70"
      max="70"
      value="0"
    >

  </div>


  <button
    class="button"
    id="projectButton"
  >
    ✦ Add PROJECT Y
  </button>


  <button
    class="button"
    id="removeButton"
  >
    Remove Design
  </button>


  <button
    class="button"
    id="resetButton"
  >
    Reset Studio
  </button>


  <div
    class="status"
    id="status"
  >
    Loading 3D garment...
  </div>

</div>


<div class="hint">
  Drag to rotate • Pinch or scroll to zoom
</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>


<!-- ORBIT CONTROLS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<!-- GLTF LOADER -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>


<script>


/* =========================================
   SCENE
========================================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x070910);


/* =========================================
   CAMERA
========================================= */

const camera =
new THREE.PerspectiveCamera(
  40,
  window.innerWidth /
  window.innerHeight,
  0.01,
  100
);

camera.position.set(
  0,
  1.5,
  5
);


/* =========================================
   RENDERER
========================================= */

const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  alpha:false
});

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputEncoding =
THREE.sRGBEncoding;

renderer.shadowMap.enabled=true;

document
  .getElementById("app")
  .appendChild(renderer.domElement);


/* =========================================
   CONTROLS
========================================= */

const controls =
new THREE.OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping=true;

controls.dampingFactor=0.08;

controls.enablePan=false;

controls.minDistance=1.5;

controls.maxDistance=8;

controls.target.set(
  0,
  1.5,
  0
);


/* =========================================
   LIGHTING
========================================= */

const ambientLight =
new THREE.HemisphereLight(
  0xffffff,
  0x202030,
  2.2
);

scene.add(
  ambientLight
);


const keyLight =
new THREE.DirectionalLight(
  0xffffff,
  3
);

keyLight.position.set(
  4,
  6,
  5
);

keyLight.castShadow=true;

scene.add(
  keyLight
);


const fillLight =
new THREE.DirectionalLight(
  0x9bb5ff,
  1.5
);

fillLight.position.set(
  -4,
  3,
  4
);

scene.add(
  fillLight
);


/* =========================================
   REAL 3D SHIRT
========================================= */

const shirt =
new THREE.Group();

scene.add(
  shirt
);


/* =========================================
   VARIABLES
========================================= */

let realShirt=null;

let design=null;

let shirtMaterials=[];


/* =========================================
   GLTF LOADER
========================================= */

const loader =
new THREE.GLTFLoader();


loader.load(

  "/My-website/tshirt.glb",


  function(gltf){

    realShirt =
    gltf.scene;


    /*
      Add ONLY the real GLB.

      There is NO old box shirt.
    */

    shirt.add(
      realShirt
    );


    /* -------------------------------------
       FIND MODEL SIZE
    ------------------------------------- */

    const box =
    new THREE.Box3()
      .setFromObject(
        realShirt
      );


    const size =
    box.getSize(
      new THREE.Vector3()
    );


    const center =
    box.getCenter(
      new THREE.Vector3()
    );


    /*
      Center the model.
    */

    realShirt.position.x -=
    center.x;

    realShirt.position.y -=
    center.y;

    realShirt.position.z -=
    center.z;


    /* -------------------------------------
       AUTOMATIC SCALE
    ------------------------------------- */

    const targetHeight=3.6;


    if(size.y > 0){

      const scale =
      targetHeight /
      size.y;


      realShirt.scale.set(
        scale,
        scale,
        scale
      );

    }


    /* -------------------------------------
       FIND ALL MATERIALS
    ------------------------------------- */

    realShirt.traverse(
      function(object){

        if(
          object.isMesh
        ){

          object.castShadow=true;

          object.receiveShadow=true;


          if(
            object.material
          ){

            if(
              Array.isArray(
                object.material
              )
            ){

              object.material
                .forEach(
                  function(mat){

                    shirtMaterials
                      .push(mat);

                  }
                );

            }

            else{

              shirtMaterials
                .push(
                  object.material
                );

            }

          }

        }

      }
    );


    /* -------------------------------------
       CAMERA POSITION
    ------------------------------------- */

    controls.target.set(
      0,
      0,
      0
    );


    camera.position.set(
      0,
      0.2,
      5
    );


    controls.update();


    /* -------------------------------------
       STATUS
    ------------------------------------- */

    document
      .getElementById(
        "status"
      )
      .textContent =
      "✓ Real 3D T-shirt loaded";


    document
      .getElementById(
        "loading"
      )
      .classList.add(
        "hidden"
      );


    console.log(
      "PROJECT Y 3D MODEL LOADED"
    );

  },


  function(xhr){

    if(xhr.total){

      const percent =
      Math.round(
        xhr.loaded /
        xhr.total *
        100
      );


      document
        .getElementById(
          "status"
        )
        .textContent =
        "Loading 3D garment... " +
        percent +
        "%";

    }

  },


  function(error){

    console.error(
      "GLB ERROR:",
      error
    );


    document
      .getElementById(
        "loading"
      )
      .textContent =
      "Unable to load the 3D garment";


    document
      .getElementById(
        "status"
      )
      .textContent =
      "⚠ Check tshirt.glb";

  }

);


/* =========================================
   GARMENT COLOR
========================================= */

document
  .getElementById(
    "shirtColor"
  )
  .addEventListener(
    "input",
    function(){

      const color =
      new THREE.Color(
        this.value
      );


      shirtMaterials
        .forEach(
          function(material){

            if(
              material.color
            ){

              material.color.copy(
                color
              );

            }

          }
        );

    }
  );


/* =========================================
   CREATE TEXT DESIGN
========================================= */

function createProjectDesign(){

  removeDesign();


  const canvas =
  document.createElement(
    "canvas"
  );


  canvas.width=1200;

  canvas.height=600;


  const ctx =
  canvas.getContext(
    "2d"
  );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.font=
  "bold 150px Arial";


  ctx.textAlign=
  "center";


  ctx.textBaseline=
  "middle";


  ctx.fillStyle=
  "#111111";


  ctx.fillText(
    "PROJECT Y",
    600,
    300
  );


  const texture =
  new THREE.CanvasTexture(
    canvas
  );


  texture.encoding =
  THREE.sRGBEncoding;


  const material =
  new THREE.MeshBasicMaterial({

    map:texture,

    transparent:true,

    side:THREE.DoubleSide

  });


  design =
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      1.5,
      0.75
    ),

    material

  );


  /*
    Put design in front
    of the garment.
  */

  design.position.set(
    0,
    0.15,
    0.8
  );


  shirt.add(
    design
  );

}


/* =========================================
   UPLOAD DESIGN
========================================= */

document
  .getElementById(
    "imageUpload"
  )
  .addEventListener(
    "change",
    function(event){

      const file =
      event.target.files[0];


      if(!file){
        return;
      }


      const reader =
      new FileReader();


      reader.onload=
      function(e){

        removeDesign();


        const textureLoader =
        new THREE.TextureLoader();


        textureLoader.load(
          e.target.result,
          function(texture){

            texture.encoding =
            THREE.sRGBEncoding;


            const material =
            new THREE.MeshBasicMaterial({

              map:texture,

              transparent:true,

              side:
              THREE.DoubleSide

            });


            design =
            new THREE.Mesh(

              new THREE.PlaneGeometry(
                1.5,
                1
              ),

              material

            );


            design.position.set(
              0,
              0.15,
              0.8
            );


            shirt.add(
              design
            );

          }
        );

      };


      reader.readAsDataURL(
        file
      );

    }
  );


/* =========================================
   DESIGN SIZE
========================================= */

document
  .getElementById(
    "designSize"
  )
  .addEventListener(
    "input",
    function(){

      const value =
      Number(
        this.value
      );


      document
        .getElementById(
          "sizeValue"
        )
        .textContent =
        value + "%";


      if(!design){
        return;
      }


      const scale =
      value / 100;


      design.scale.set(
        scale,
        scale,
        scale
      );

    }
  );


/* =========================================
   DESIGN POSITION
========================================= */

document
  .getElementById(
    "designPosition"
  )
  .addEventListener(
    "input",
    function(){

      const value =
      Number(
        this.value
      );


      document
        .getElementById(
          "positionValue"
        )
        .textContent =
        value;


      if(!design){
        return;
      }


      design.position.y =
      0.15 +
      value / 100;

    }
  );


/* =========================================
   ADD PROJECT Y
========================================= */

document
  .getElementById(
    "projectButton"
  )
  .addEventListener(
    "click",
    function(){

      createProjectDesign();

    }
  );


/* =========================================
   REMOVE DESIGN
========================================= */

function removeDesign(){

  if(!design){
    return;
  }


  shirt.remove(
    design
  );


  if(
    design.material &&
    design.material.map
  ){

    design.material.map.dispose();

  }


  if(
    design.material
  ){

    design.material.dispose();

  }


  design.geometry.dispose();


  design=null;

}


/* =========================================
   REMOVE BUTTON
========================================= */

document
  .getElementById(
    "removeButton"
  )
  .addEventListener(
    "click",
    function(){

      removeDesign();

    }
  );


/* =========================================
   RESET
========================================= */

document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    function(){

      /*
        Reset color.
      */

      const defaultColor =
      new THREE.Color(
        "#eeeeee"
      );


      document
        .getElementById(
          "shirtColor"
        )
        .value="#eeeeee";


      shirtMaterials
        .forEach(
          function(material){

            if(
              material.color
            ){

              material.color.copy(
                defaultColor
              );

            }

          }
        );


      /*
        Reset design.
      */

      removeDesign();


      document
        .getElementById(
          "designSize"
        )
        .value=100;


      document
        .getElementById(
          "sizeValue"
        )
        .textContent="100%";


      document
        .getElementById(
          "designPosition"
        )
        .value=0;


      document
        .getElementById(
          "positionValue"
        )
        .textContent="0";


      /*
        Reset camera.
      */

      camera.position.set(
        0,
        0.2,
        5
      );


      controls.target.set(
        0,
        0,
        0
      );


      controls.update();

    }
  );


/* =========================================
   START WITH PROJECT Y
========================================= */

createProjectDesign();


/* =========================================
   WINDOW RESIZE
========================================= */

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =========================================
   ANIMATION
========================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>

</body>
  </html>
